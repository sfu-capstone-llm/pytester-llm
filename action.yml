name: 'Python Test Coverage Analyzer'
description: 'Run Python tests, analyze coverage, and suggest test improvements'
author: 'your-username'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.9'
  coverage-threshold:
    description: 'Coverage threshold percentage'
    required: false
    default: '80'
  requirements-file:
    description: 'Requirements file path'
    required: false
    default: 'requirements.txt'
  test-path:
    description: 'Test directory path'
    required: false
    default: '.'
  github-token:
    description: 'GitHub token for PR comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f "${{ inputs.requirements-file }}" ]; then pip install -r "${{ inputs.requirements-file }}"; fi
    
    - name: Run tests with coverage
      shell: bash
      run: |
        pytest ${{ inputs.test-path }} --cov=. --cov-report=xml --cov-report=json --cov-report=term-missing
    
    - name: Analyze coverage
      shell: bash
      run: |
        export COVERAGE_THRESHOLD=${{ inputs.coverage-threshold }}
        python ${{ github.action_path }}/scripts/coverage_analyzer.py
    
    - name: Generate PR comment
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        python ${{ github.action_path }}/scripts/pr_comment_generator.py
    
    - name: Post PR comment
      if: github.event_name == 'pull_request' && hashFiles('pr_comment.md') != ''
      uses: actions/github-script@v6
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          
          try {
            const comment = fs.readFileSync('pr_comment.md', 'utf8');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('No PR comment to post');
          }